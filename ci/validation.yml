name: Stage B Contract Fragility Benchmark CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reproducibility and Integrity Verification
        run: |
          python scripts/verify_reproducibility.py

      - name: Run Epistemic Research Claim Linter
        run: |
          python src/lint_research_claims.py

      - name: Run OpenAPI Reference Closure Audit
        run: |
          python src/audit_openapi_reference_closure.py

      - name: Run Pinned Source Closure Audit
        run: |
          python src/audit_pinned_source_closure.py

      - name: Run V3 Candidate Provenance and Difference Audit
        run: |
          python src/audit_v3_candidate_provenance.py

      - name: Run V4 Candidate Provenance and Difference Audit
        run: |
          python src/audit_v4_candidate_provenance.py

      - name: Run Batch Extraction Candidate Self-Test (Dry-Run)
        run: |
          python src/extract_stage_b_batch_candidates.py --all --dry-run

      - name: Run Adversarial Red-Team Reproducibility Verification
        run: |
          python scripts/red_team_reproducibility.py

      - name: Run Stage C Reproducibility Verification
        run: |
          python scripts/verify_stage_c_reproducibility.py

      - name: Run Stage C Benchmark Audit
        run: |
          python src/audit_stage_c_benchmark.py

      - name: Run Stage C Construct Validity Verification
        run: |
          python scripts/verify_stage_c_construct_validity.py

      - name: Run Stage C Execution Readiness Check
        run: |
          python src/check_stage_c_execution_readiness.py

      - name: Run Stage C Release 2 Reproducibility Verification
        run: |
          python scripts/verify_stage_c_release2_reproducibility.py

      - name: Run Stage C Release 2 Execution Readiness Check
        run: |
          python src/check_stage_c_release2_execution_readiness.py

      - name: Run Full Test Suite with Verbose Reporting
        run: |
          python -m pytest -v
