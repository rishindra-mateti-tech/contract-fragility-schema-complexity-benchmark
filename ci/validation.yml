name: Stage B Contract Fragility Benchmark CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reproducibility and Integrity Verification
        run: |
          python scripts/verify_reproducibility.py

      - name: Run Epistemic Research Claim Linter
        run: |
          python src/lint_research_claims.py

      - name: Run Adversarial Red-Team Reproducibility Verification
        run: |
          python scripts/red_team_reproducibility.py

      - name: Run Full Test Suite with Verbose Reporting
        run: |
          python -m pytest -v
