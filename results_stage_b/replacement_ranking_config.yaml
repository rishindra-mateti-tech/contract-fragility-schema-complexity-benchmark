    replacement_rationale: "Replaces issues/create (disqualified due to depth 6 recursion overflow and labels.items object union)."
    statefulness_warning: >
      pulls/submit-review requires an existing review_id (stateful dependency).
      Self-contained operations such as pulls/create should be evaluated alongside it.
    priority_patterns:
      - pattern: "issues/{issue_number}/comments"
        weight: 25
      - pattern: "/pulls"
        weight: 24
      - pattern: "/dispatches"
        weight: 23
