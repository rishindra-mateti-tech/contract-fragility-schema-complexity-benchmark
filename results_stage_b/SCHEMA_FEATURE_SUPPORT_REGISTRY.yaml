# Stage B Schema Feature Support Registry
# Defines extraction behavior, validation rules, lineage tracking, and benchmark status
# for every JSON Schema and OpenAPI 3.0 / 3.1 construct observed across candidates.

registry_version: "1.0.0"
governing_specification: "STAGE_B_EXTRACTION_SPEC.md"
last_updated_utc: "2026-10-19T23:05:00Z"

taxonomies:
  extraction_behaviors:
    PRESERVE_VERBATIM:
      description: "Feature must be copied to canonical contract with 100% fidelity without renaming, type coercion, or keyword omission."
      strictness: "LOSSLESS"
    EXPLICIT_NORMALIZATION:
      description: "Transformation permitted only under an explicit, reviewed, versioned benchmark normalization policy."
      strictness: "POLICY_GOVERNED"
    REJECT_AND_REPORT:
      description: "Feature is unsupported in the current benchmark phase. Extractor must fail-closed and abort extraction."
      strictness: "FAIL_CLOSED"

  current_benchmark_statuses:
    SUPPORTED: "Fully engineered, tested via metamorphic/unit fixtures, and verified in active pilot canonical contracts."
    EXPERIMENTAL: "Implemented in extraction engine but pending formal human validation or multi-operation generalization."
    UNSUPPORTED_FAIL_CLOSED: "Intentionally unsupported in current benchmark phase; extractor strictly halts execution."

categories:
  - PRIMITIVE_TYPES
  - ENUMS_CONST_DEFAULTS
  - BOUNDS_CONSTRAINTS
  - OBJECTS_ARRAYS_MAPS
  - SCHEMA_REFERENCES
  - COMPOSITION_POLYMORPHISM
  - MODIFIERS_METADATA
  - TRANSPORT_SURFACES
  - CONTENT_TYPES
  - FORM_ENCODING_MODIFIERS
  - BINARY_MULTIPART
  - RECURSION_CYCLES

